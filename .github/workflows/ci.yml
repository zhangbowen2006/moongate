name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonbit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/moon-install.ps1"
          & "$env:RUNNER_TEMP/moon-install.ps1"
          "$env:USERPROFILE/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: moon version --all
      - run: moon check --deny-warn
      - run: moon test --deny-warn
      - run: moon fmt --check
      - run: node scripts/build.mjs
      - run: node --test test/*.test.mjs
      - run: node demo/run.mjs

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: node scripts/build.mjs
      - name: Install official MCP packages
        working-directory: interop
        run: npm install --no-audit --no-fund
      - name: Run interop checks
        run: node interop/client.mjs
